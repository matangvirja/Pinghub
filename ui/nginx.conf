server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI calls /api/... and nginx forwards it to the gateway. Keeping the
    # browser on one origin means no CORS surprises and no hard-coded host.
    location /api/ {
        # Chat file uploads (multipart bodies) must be allowed through nginx.
        client_max_body_size 16m;
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Dashboard + in-app load test.
    location /ops/ {
        proxy_pass http://ops-api:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # The app shell and its code change whenever the image is rebuilt. Make
    # browsers revalidate so users never see a stale UI after an update.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
